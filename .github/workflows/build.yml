name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      UXPLAY_REF: v1.73.7
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git curl
          pacboy: >-
            cmake:p ninja:p gcc:p pkgconf:p ntldd:p
            openssl:p libplist:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p
            gst-plugins-bad:p gst-libav:p
            libsoup3:p glib-networking:p ca-certificates:p

      - name: Build and package UxPlay engine
        shell: msys2 {0}
        env:
          SKIP_PACMAN: "1"
        run: ./scripts/build-uxplay.sh dist/uxplay

      - name: Smoke-test the engine
        shell: msys2 {0}
        run: ./dist/uxplay/bin/uxplay.exe -h | head -5 || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish tray app
        run: >
          dotnet publish src/AirPlayPro/AirPlayPro.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o dist/app

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          & iscc "/DAppVersion=$version" installer/AirPlayPro.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AirPlayPro-Setup
          path: dist/AirPlayPro-Setup-*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AirPlayPro-Setup-*.exe
